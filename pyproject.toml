[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pangolinbench"
version = "0.1.0"
description = "PangolinBench tokenizer evaluation suite for Taiwan-centric tokenizer behavior."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
throughput = ["ubitok"]
transcription = ["ubi-tokenizer[transcription]"]

[project.scripts]
pangolinbench = "pangolinbench.cli:main"
pangolinbench-throughput = "pangolinbench.throughput:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
